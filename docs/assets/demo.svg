<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 360" font-family="Segoe UI, system-ui, sans-serif" role="img" aria-label="dsh-nextsteps demo: followup cards appear under a finished turn and one click sends the prompt">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="990" height="360" fill="#0b0d10"/>
  <g>
    <rect x="30" y="30" width="930" height="300" rx="12" fill="#0d0f12" stroke="#262b31"/>
    <text x="60" y="70" fill="#e5e7eb" font-size="13" font-weight="600">The agent finished the turn — the tool call lands at the end</text>
    <rect x="60" y="90" width="430" height="30" rx="8" fill="#16181d" stroke="#2a2f36"/>
    <text x="76" y="110" fill="#9ca3af" font-size="10.5" font-family="ui-monospace, monospace">⚙ suggest_followups { "followups": [ … ] } ✓</text>
    <text x="60" y="150" fill="#d1d5db" font-size="12">Here is the refactor you asked for — the parser now streams,</text>
    <text x="60" y="168" fill="#d1d5db" font-size="12">and the CLI gained a dry-run mode. Next steps?</text>
    <g filter="url(#soft)" opacity="0">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.14;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0.22 1 0.36 1;0 0 1 1"/>
      <animateTransform attributeName="transform" type="translate" values="0 14;0 0;0 0" keyTimes="0;0.14;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0.22 1 0.36 1;0 0 1 1"/>
      <rect x="60" y="196" width="870" height="42" rx="10" fill="#101214" stroke="#2a2f36"/>
      <text x="80" y="222" fill="#6b7280" font-size="11">Suggested followups</text>
      <rect x="250" y="204" width="270" height="26" rx="13" fill="#141a20" stroke="#2a2f36"/>
      <text x="266" y="221" fill="#e5e7eb" font-size="10.5">Add streaming progress events</text>
      <text x="540" y="221" fill="#9ca3af" font-size="9" opacity="0">
        <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.2;1" dur="8s" repeatCount="indefinite"/>
        ✓
      </text>
      <rect x="532" y="204" width="210" height="26" rx="13" fill="#141a20" stroke="#2a2f36"/>
      <text x="548" y="221" fill="#e5e7eb" font-size="10.5">Write parser edge-case tests</text>
      <rect x="754" y="204" width="156" height="26" rx="13" fill="#141a20" stroke="#2a2f36"/>
      <text x="770" y="221" fill="#e5e7eb" font-size="10.5">Benchmark the CLI</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.36;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0.22 1 0.36 1;0 0 1 1"/>
      <g filter="url(#soft)">
        <rect x="60" y="252" width="560" height="34" rx="10" fill="#1f242b" stroke="#33383f"/>
        <circle cx="80" cy="269" r="8" fill="#22c55e"/>
        <text x="96" y="273" fill="#f3f4f6" font-size="11">Add streaming progress events</text>
      </g>
      <path d="M120 258 C 140 244, 150 232, 156 224" stroke="#9ca3af" stroke-width="1.5" fill="none" opacity="0.7">
        <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.32;0.4;0.5" dur="8s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="60" y="316" fill="#6b7280" font-size="11">One click sends the prompt as your next message — the card flips to <tspan fill="#22c55e">sent ✓</tspan></text>
  </g>
</svg>
